name: Daily Scrapers

on:
  schedule:
    # Runs every day at 09:00 UTC — adjust if you need a different timezone
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci
        working-directory: "."

      - name: Delete jobs older than 30 days
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node delete-old-jobs.js
        working-directory: "."

      - name: Run workingnomads scraper (work:100) with retries
        run: |
          max_attempts=10
          attempt=1
          until [ $attempt -gt $max_attempts ]
          do
            echo "Attempt $attempt/$max_attempts: running workingnomads scraper"
            npm run work:100 && break
            echo "Workingnomads scraper failed on attempt $attempt"
            sleep_seconds=$(( attempt * 10 ))
            echo "Waiting ${sleep_seconds}s before retrying..."
            sleep $sleep_seconds
            attempt=$(( attempt + 1 ))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "All $max_attempts attempts failed. Failing job."
            exit 1
          fi
        working-directory: "."

      - name: Run justjoin.it scraper (scrape:100) with retries
        run: |
          max_attempts=10
          attempt=1
          until [ $attempt -gt $max_attempts ]
          do
            echo "Attempt $attempt/$max_attempts: running scraper"
            npm run scrape:100 && break
            echo "Scraper failed on attempt $attempt"
            sleep_seconds=$(( attempt * 10 ))
            echo "Waiting ${sleep_seconds}s before retrying..."
            sleep $sleep_seconds
            attempt=$(( attempt + 1 ))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "All $max_attempts attempts failed. Failing job."
            exit 1
          fi
        working-directory: "."

      - name: Merge outputs and import to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node import-to-db.js
        working-directory: "."
