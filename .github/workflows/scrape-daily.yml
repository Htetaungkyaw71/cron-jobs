name: Daily Scrapers

on:
  schedule:
    # Runs every day at 09:00 UTC — adjust if you need a different timezone
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies (files/)
        run: npm ci
        working-directory: files

      - name: Run justjoin.it scraper (scrape:100)
        run: npm run scrape:100
        working-directory: files

      - name: Run workingnomads scraper (work:100)
        run: npm run work:100
        working-directory: files

      - name: Merge outputs and import to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node import-to-db.js
        working-directory: files
